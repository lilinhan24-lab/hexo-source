name: Maintenance failure alerts

on:
  workflow_run:
    workflows: ['Build and validate', 'Article email notifications', 'Backup and restore verification']
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: han-maintenance-alerts
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","timed_out","action_required"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out the failing run's code; only the trusted default branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { reportFailure } = require('./lib/maintenance-alert.cjs');
            core.info(JSON.stringify(await reportFailure(github, context.payload.workflow_run, context.repo)));
